# RK-BAKEOFF — the extractor-model bake-off knobs (plan §8).
#
# Every number the bake-off's VERDICT depends on lives here, not in code: the replication count, the
# minimum margin, the match policy's leniency, the gate patterns, the criterion weights. The matcher's
# leniency IS the measurement, so it has to be readable and changeable by whoever reads the scorecard.
#
# This file is NOT read by `chanakya` — `ConfigStore` seeds from an explicit list of eight section files
# and ignores everything else. It is an EVAL-side config, kept next to the others because that is where
# this project keeps operator-editable knobs.
#
# Nothing here is tuned to any observed result: the implementer of the scorer is corpus-blind and has
# never seen a candidate's output. These are declared-in-advance defaults, chosen on general principle.

schema_version: rk-bakeoff/1.0

# ── Replication: how many times each candidate is run, and when ranking is even allowed ────────────
# Re-extraction is empirically NON-DETERMINISTIC on a small slice. One run per candidate therefore
# measures a sample, not a model. `min_runs_for_ranking` is a hard structural floor: below it the
# comparative report refuses to rank at all and returns INSUFFICIENT_REPLICATION — the same posture the
# system takes toward a thin evidence base.
replication:
  runs_per_candidate: 5
  min_runs_for_ranking: 3

# ── The minimum-margin rule: when is a gap REAL? ───────────────────────────────────────────────────
# A difference between two candidates on a metric is "material" only when
#     |mean_a - mean_b|  >=  max(min_absolute, noise_multiplier * pooled_sd)
# where pooled_sd = sqrt((sd_a^2 + sd_b^2) / 2) over the N runs. Anything smaller is reported as
# NO MEASURED DIFFERENCE and can never produce a winner.
#   min_absolute      floor on the gap in the metric's own units (rates are 0..1), so a vanishingly
#                     small but low-variance gap is still not called material.
#   noise_multiplier  how many pooled standard deviations the gap must clear.
margin:
  min_absolute: 0.03
  noise_multiplier: 2.0
  # Optional per-metric override of `min_absolute`, keyed by metric name.
  per_metric_min_absolute: {}

# ── Gating preconditions (PASS/FAIL to WIN — never weighted) ───────────────────────────────────────
gates:
  # A model id matching any of these is a FLOATING ALIAS: it can silently change under us, which breaks
  # both reproducibility and KEYLESS==LIVE (the frozen seed would stop equalling what live produces).
  floating_alias_patterns: ["-latest", ":latest", "@latest", "latest"]
  # A production winner's client must live on the shipped ingest path — a client that only exists under
  # `backend/eval` cannot be the producer that freezes the seed bundles, so it cannot restore
  # KEYLESS==LIVE by construction.
  production_client_package: "chanakya.ingest"
  # The NON-NEGOTIABLE criteria. Naming a metric here does two things, and neither of them is a weight:
  #
  #   1. it must be MEASURED. A declared non-negotiable that no run scored reads as gate UNKNOWN, and
  #      UNKNOWN blocks — otherwise a non-negotiable is traded away simply by failing to measure it.
  #   2. it may not be traded against score. Before the weighted composite may name a winner, that winner
  #      must not be MATERIALLY worse than any rival on one of these — "materially" being the same margin
  #      rule used everywhere else, so no new threshold is invented (see compare.decide).
  #
  # The `null` is the optional ABSOLUTE floor, and it stays null: picking that number is a human judgement
  # about how much fabrication is tolerable, and a scorer that invents it has decided the question it was
  # built to measure. The relative veto needs no such number.
  #
  # `trap_avoidance` is declared HERE and deliberately carries NO weight below. It is the project's one
  # non-negotiable expressed as a metric — did the candidate assert something the document does not say, at
  # the places the labeled slice knows the answer — and inside a composite it would be just a heavy weight.
  # Any weight is a price a good-enough model can pay: a model far enough ahead on F1 could buy past a
  # worse fabrication record, then re-extract and re-freeze the graded oracle, writing ungrounded claims
  # into the evidence layer wearing valid citations, which nothing downstream catches.
  non_negotiable_floors:
    citation_faithfulness: null
    extract_only_stated: null
    trap_avoidance: null

# ── Criterion weights (plan §8: "weighted to what the replumb depends on", highest first) ──────────
# Only metrics whose unit is a rate (0..1) enter the weighted composite. Cost and latency are REPORTED
# with their own per-metric verdicts and deliberately excluded from the composite: folding seconds and
# dollars into a 0..1 score needs a normalisation constant nobody has justified, and inventing one would
# manufacture separation. They are human tie-breakers.
weights:
  # Top-weighted, and now MEASURABLE: S3 (RK-COREF) shipped extraction pass 2, a second forced-tool call
  # whose schema carries the model's own mention clustering, and whose accepted clusters mint the
  # referent id this metric scores. It is flag-gated — see `required_metrics` below.
  coref_binding: 5.0
  discriminator_capture: 4.5
  citation_faithfulness: 4.5    # non-negotiable
  extract_only_stated: 4.5      # non-negotiable
  # A7's other half: of the discriminators the source does NOT state, how many did the model correctly
  # leave empty? Inventing an operator or a location is the same failure as inventing a claim, so this
  # is weighted alongside the fabrication line rather than treated as a nicety.
  discriminator_fabrication_avoidance: 4.0
  structured_output_reliability: 3.0
  surface_f1: 3.0
  graph_recall: 3.0
  determinism: 2.0
  kind_tagging: 0.5             # low — it self-corrects (D-13.5)
  # NOT LISTED, ON PURPOSE:
  #   trap_avoidance     — a veto, not a weight. See gates.non_negotiable_floors above.
  #   identity_over_read — N=2. The gold's own reporting rule is "report the raw count, never a
  #                        two-decimal rate, and never rank on it", so it is emitted as a `count`, which
  #                        the composite refuses structurally (only 0..1 rates are composited).

# ── Required criteria: no winner may be named while any of these is UNMEASURED ─────────────────────
# A weight and a requirement are different things. A weighted metric that cannot be scored is excluded
# from the composite and named in the exclusions; a REQUIRED one blocks the verdict outright
# (INSUFFICIENT_CRITERIA). Plan §8 splits this bake-off into a Wave-0 screen and a "definitive pass
# after RK-ATOMS / RK-COREF", because the two TOP-weighted criteria cannot be measured until those land.
# Listing them here is what stops a Wave-0 run from rendering a finished-looking scorecard that has
# measured only the low-weight half — nobody re-runs a bake-off that already has a verdict.
#
# The block lifts by itself: measure them and the verdict proceeds. Removing a name from this list is a
# decision to rank without it, and should be made deliberately rather than to make a red run go green.
#
# `coref_binding` no longer blocks for want of a channel — S3 built one. It blocks for want of the
# channel being SWITCHED ON: extraction pass 2 is dormant unless `resolution.earned_identity.enabled` is
# true, and that ships FALSE. So the bake-off must be run with the flag on, which costs a second
# extraction call per document and is a deliberate operator decision, not a default. The harness checks
# this as a PRECONDITION (eval/extraction/coref_channel.py) before spending a single API call, and names
# the flag when it refuses — so the failure mode is a loud refusal up front, never N paid runs followed
# by a blank cell.
required_metrics:
  - coref_binding           # measurable with resolution.earned_identity.enabled: true (ships false)
  - discriminator_capture   # needs A7 discriminators graded against the labeled slice

# ── The claim-match policy: what counts as the same claim ──────────────────────────────────────────
# This is the measurement. Read it before reading any number the scorecard prints.
match_policy:
  # Similarity function over normalised surfaces (rapidfuzz), scaled to 0..1.
  #   token_sort_ratio — order-insensitive, duplicate-sensitive (DEFAULT)
  #   token_set_ratio  — also ignores non-shared tokens; much more lenient
  #   partial_ratio    — best matching substring; very lenient
  #   ratio            — plain edit similarity; order-sensitive
  #
  # Why token_sort_ratio and not the usual token_set_ratio: token_set_ratio compares the shared-token
  # intersection, so it scores "C Works" against "Invented Works" at 0.83 — a near-match for a name the
  # model made up that happens to share one token with the truth. That is precisely the failure this
  # bake-off exists to catch, and a matcher that launders it would report fabrication as recall.
  # token_sort_ratio scores that pair 0.57 (rejected) while still accepting real surface variation
  # ("North Ridge Foundry" vs "North Ridge Foundry Ltd" = 0.90).
  #
  # The cost is the opposite error: a legitimate match with an added qualifier ("Type-7 Coupler" vs
  # "Type-7 Coupler assembly" = 0.76) can be missed. That error direction is the safer one here — missed
  # matches add run-to-run variance, and more variance makes the margin rule MORE reluctant to call a
  # gap material, whereas leniency quietly inflates every candidate and hides the fabrication line.
  # Whoever owns the claim gold should sanity-check this choice against a labeled sample.
  similarity: token_sort_ratio
  # A gold claim and an extracted claim may only pair if these hold.
  require_same_form: true       # triple / entity / event must agree
  require_same_polarity: true   # a negation is NOT a match for the assertion
  predicate_policy: normalized  # exact | normalized (casefold + unify -_/space) | ignore
  entity_type_policy: normalized
  # Per-role similarity floor (subject, object, name, each participant) and the floor on their mean.
  role_min_similarity: 0.70
  pair_min_similarity: 0.80
  # Span agreement between the gold doc_ref and the extracted doc_ref, as intersection-over-union.
  #   ignore  — spans play no part in pairing
  #   bonus   — span IoU nudges the pair score (does not gate) — default
  #   require — a pair with resolvable spans on both sides must clear `span_iou_floor`
  span_policy: bonus
  span_iou_floor: 0.30
  span_bonus_weight: 0.15
  # Grounding checks (citation faithfulness + extract-only-stated) use this floor when asking "does this
  # surface actually appear in the cited span / anywhere in the document?" (rapidfuzz partial_ratio).
  grounding_similarity: 0.85

# ── The candidates ────────────────────────────────────────────────────────────────────────────────
# Each entry is a *declaration*, not a promise that it can be exercised: `key_env` and `sdk_module` are
# checked at run time and an unexercisable candidate is reported as such rather than scored.
#
# `pricing` is null everywhere on purpose. Nobody here knows these models' real prices, and a fabricated
# price is a fabricated benchmark line; cost is reported as UNPRICED until a human fills these in.
candidates:
  - id: anthropic-opus-5
    label: "Anthropic Opus 5"
    provider: anthropic
    # PINNED. `claude-opus-5` is the complete, concrete id — the Anthropic scheme carries no date suffix
    # on a current model, and appending one 404s. It is not a floating alias: it does not resolve to
    # "whatever Opus is newest", it names Opus 5 and nothing else.
    model_id: claude-opus-5
    client_module: chanakya.ingest.client
    client_class: AnthropicExtractionClient
    sdk_module: anthropic
    key_env: ANTHROPIC_API_KEY
    multimodal: native
    freezes_seed: true
    pricing: null

  - id: gemini-3-6-flash
    label: "Gemini Flash 3.6"
    provider: google
    # PINNED, and deliberately NOT `gemini-flash-latest` (which the shipped extraction client still uses
    # as its live-resilience default). The alias tracks whatever Flash is current, so a frozen seed would
    # silently stop equalling what live produces — it fails the pinned-model-id gate by design.
    # `gemini-3.6-flash` reports version `3.6-flash-07-2026` from the models endpoint; that version
    # string is metadata, not an addressable id, so the concrete id is this.
    model_id: gemini-3.6-flash
    client_module: chanakya.ingest.client
    client_class: GeminiExtractionClient
    sdk_module: google.genai
    key_env: GEMINI_API_KEY
    multimodal: native
    freezes_seed: true
    pricing: null

  - id: openai-gpt-5-6-sol
    label: "OpenAI GPT 5.6 Sol"
    provider: openai
    # PINNED. The OpenAI models endpoint exposes no dated snapshot for the 5.6 family (`gpt-5.6-sol`,
    # `-luna`, `-terra` and nothing else), so this IS the concrete id — there is no more specific one to
    # pin to.
    model_id: gpt-5.6-sol
    # NOTE: this client lives under `backend/eval`, so it FAILS the KEYLESS==LIVE gate as configured.
    # That is the honest state today, not an oversight: to win, the client has to move to
    # `chanakya/ingest` first (which also means adding `openai` to the shipped image's dependencies —
    # a deliberate decision, not a config edit). See gates.production_client_package.
    client_module: eval.extraction.gpt_client
    client_class: OpenAIExtractionClient
    sdk_module: openai
    key_env: OPENAI_API_KEY
    multimodal: native
    freezes_seed: false
    pricing: null
