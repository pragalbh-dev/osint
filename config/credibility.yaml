# config/credibility.yaml — Confidence Resolver config (spine/04; spine/08 §3.4-§3.6).
# Validates against F0 CredibilityConfig {factor_weights, source_class_factors, integrity_penalties,
# thresholds, half_lives_days} (+ extra `gates`, allowed by extra="allow"). Every numeric knob lives
# here, never in code (gate G6). R(source) is the rubric's OUTPUT (factor_weights x source_class_factors),
# never a hand-typed per-class constant — the R values in comments are sanity-check outputs, not inputs.
# source_class_factors keys == sources.yaml `source_type` values (SCORE does a direct lookup, no mapping).

factor_weights:
  authority: 0.35
  process: 0.30
  directness: 0.10
  track_record: 0.10          # held at neutral prior (0.5) for the demo — dynamic per-source rating is a roadmap seam
  intrinsic_plausibility: 0.15 # held at ceiling (1.0) for the demo — only a per-claim LLM DOWNWARD override lowers it

source_class_factors:
  curated-register:      {authority: 0.95, process: 0.95, directness: 0.30, track_record: 0.50, intrinsic_plausibility: 1.0}  # R≈0.85 (SIPRI)
  satellite:             {authority: 0.90, process: 0.85, directness: 0.90, track_record: 0.50, intrinsic_plausibility: 1.0}  # R≈0.86
  official:              {authority: 0.90, process: 0.50, directness: 0.90, track_record: 0.50, intrinsic_plausibility: 1.0}  # R≈0.75 (ISPR)
  think-tank:            {authority: 0.60, process: 0.85, directness: 0.25, track_record: 0.50, intrinsic_plausibility: 1.0}  # R≈0.69 (CSIS/RAND/IISS)
  trade-media:           {authority: 0.50, process: 0.75, directness: 0.35, track_record: 0.50, intrinsic_plausibility: 1.0}  # R≈0.64 (Quwa/Jane's)
  customs-tender:        {authority: 0.55, process: 0.55, directness: 0.55, track_record: 0.50, intrinsic_plausibility: 1.0}  # R≈0.61
  exporter-state-media:  {authority: 0.60, process: 0.80, directness: 0.50, track_record: 0.50, intrinsic_plausibility: 1.0}  # R≈0.70 (Global Times; authored, not doc-anchored)
  named-social:          {authority: 0.15, process: 0.10, directness: 0.70, track_record: 0.50, intrinsic_plausibility: 1.0}  # R≈0.35
  anon-social:           {authority: 0.05, process: 0.05, directness: 0.20, track_record: 0.50, intrinsic_plausibility: 1.0}  # R≈0.25

integrity_penalties:
  # Flattened "<table>.<flag>" keys (4 M4 tables -> one flat dict[str,float], the frozen field's type).
  # SCORE lookup: integrity_penalties.get(f"{table}.{flag}", 1.0) per table, then multiply the four
  # results. Missing key -> 1.0 (no penalty) so an absent signal never silently zeroes credibility.
  artifact_integrity.unaltered: 1.0
  artifact_integrity.unverifiable: 0.85
  artifact_integrity.edited: 0.30
  artifact_integrity.synthetic: 0.10
  first_seen.original: 1.0
  first_seen.recycled: 0.30
  caption.consistent: 1.0
  caption.uncheckable: 0.9
  caption.mismatched: 0.30
  coordinated_inauthenticity.independent: 1.0
  coordinated_inauthenticity.suspected: 0.5
  coordinated_inauthenticity.too_clean: 0.4

# GATES, not multipliers (spine/04; DECISIONS). Extra field. SCORE reads gate_flags
# (schemas/stage_io.py AssertionInput.gate_flags: "adversary-denial","decoy-risk") against this map.
gates:
  adversary_denial:
    flag: adversary-denial
    exclude_from_grouping: true    # never enters an independence group -> never corroborates
    cap_at_probable: true          # caps the affected assertion at PROBABLE even if math clears 0.80
  decoy_risk:
    flag: decoy-risk
    exclude_from_grouping: false    # single-pass imagery still counts as a look — only the STATUS is capped
    cap_at_probable: true          # single-pass basing can never reach CONFIRMED

thresholds:
  confirmed: 0.80
  probable: 0.50
  # "possible" has no separate cutoff: assessable AND assertion_confidence < 0.50.

# ── the supersession floor (EVAL RCA D-P4.4 condition iv; D8 / md/11:22 / SCORE.md:94-97) ────────
# Read by `chanakya.credibility.supersession.promote_supersessions`, POST-status (the gate asks about the
# newer assertion's confidence + deception flags, which do not exist when view/supersede.py runs).
# Retiring a fact an analyst may already have acted on is a privileged operation, so being NEWER is
# necessary but not sufficient: the newer assertion must also stand on its own. Below this bar nothing is
# retired — the pair keeps `candidate_supersede` and routes to HITL, which D-P4.4 makes the DEFAULT
# outcome, not the exception. The corpus carries `d20_supersede_spoof` (grade E, bias_vector: adversary,
# decoy_risk_flag: true), planted to retire the well-evidenced Rahwali position off one low-grade look;
# this block is what refuses it — not the accident that it currently emits no relationship claim.
# NOTE: deleting this block does not disable the gate, it fails CLOSED (nothing is ever auto-retired).
supersede_floor:
  min_band: probable            # names a key in `thresholds` above — never a second copy of the number
  min_independent_looks: 1      # >=1 independent look (weighted, same measure as min_independent_groups)
  newer_status_allow: [probable, confirmed]   # the newer assertion's own label must be a live assessment
  blocking_gate_flags: [adversary-denial, decoy-risk, contradiction]  # "clean deception gate" (spine/04 §3.4)
  # THE EARNED-IDENTITY GATE (R1.4). The four conditions above are all about the newer CLAIM. None of them
  # asks whether the SUBJECT is one thing. That matters because promoting does three things at once: it
  # retires the older position, it POPS THE PAIR OUT OF THE ANALYST'S QUEUE ("adjudicated by the machine"),
  # and — when the two targets differ — it DRAWS a relocation. `based-at` is functional and unit-keyed, so
  # if an identity error fused two co-located batteries their two sites became one unit's before/after, and
  # that error is then laundered into a positively-asserted movement the analyst is never asked about: the
  # non-negotiable breached with no component lying. So machine promotion is only legitimate over an
  # identity the system EARNED. Scoped to promotions that would DRAW a relocation (differing targets) — a
  # same-target refresh asserts no movement — and it holds when the subject's identity is still an OPEN
  # QUESTION: a build-materialized provisional instance, or an endpoint of an open `candidate` merge (a
  # same-as the resolver put in front of the analyst and nobody has adjudicated).
  # WHAT THIS IS NOT: the node's assessed status. The legitimate flagship relocation sits at `probable`, so
  # reading the confidence label would suppress the very beat this is meant to leave working. The test is in
  # the MERGE-BAND vocabulary — is the identity decision open? — not on the confidence scale. A never-merged
  # subject, and one whose merges are all settled, both pass: no identity decision is pending, so there is
  # none to distrust, and holding those would stop every honest relocation and teach the analyst to ignore
  # the queue. Held ⇒ `candidate_supersede` stays and the analyst decides, which D-P4.4 already makes the
  # DEFAULT outcome.
  # There is NO KNOB here. The gate was declared as `require_earned_identity: true` — a boolean with no
  # number to tune, i.e. a switch for turning a safety prohibition off. A prohibition that closes a
  # fabrication path cannot be optional, so it is now part of the pass and not part of the config.

# ── the assertable band (ASK; spine/09) ──────────────────────────────────────────────────────────
# Which assessed statuses are strong enough for an ANSWER to *rest on* a link — i.e. to walk it as the
# spine of a trace and name its far end as a finding. Same shape and same doctrine as
# `supersede_floor.newer_status_allow` above: a status list naming keys the status machine emits, never a
# second copy of a threshold number. Strongest first — ASK breaks ties in this order.
#
# What this is NOT: a filter. A link outside this band is still traversed, still returned by the tools,
# and is printed in the answer as *weighed and not carried*, with its status and its citation. Silently
# suppressing a low-credibility attribution would make a planted false one indistinguishable from one
# that was never seen — the opposite of the non-negotiable. The corpus's `d23_cpmiec_false_attribution`
# ("CPMIEC manufactures the HT-233", refuted by d22) is exactly the link this band keeps *off* the
# assessment while keeping it *on* the page.
assertable_status: [confirmed, probable]

# ASK answer-integrity: the LLM entailment ("NLI") judge that runs ON TOP of the always-on deterministic
# citation checks (cited / citation exists / hop-support / real counts). Those deterministic checks already
# guarantee no naked or fabricated sentence — each sentence is BUILT FROM the tool-returned claim_ids — so
# this NLI pass is a belt-on-braces whose only marginal catch is edge phrasing that over-claims a relation.
# It "defaults to no when unsure" and is the sole source of spurious whole-answer withholding on free-form
# queries. Default OFF (deterministic grounding only); set true to re-enable, no restart (hot-config).
entailment_judge_enabled: false

# ── SCORE resolver knobs (introduced by SCORE; DATA-C owns/tunes the values) ──────────────────────
# Every numeric knob the Confidence Resolver reads lives here, never in code (gate G6).
decay_base: 2                 # freshness = decay_base^(-age/half_life) → exactly halves at one half-life
min_independent_groups: 2     # ≥2 independent looks required to reach `confirmed`
same_class_weight: 0.5        # a same-discipline ("same-class-but-passing") corroborating look = half weight
pdq_recycled_hamming: 10      # PDQ Hamming radius under which a re-seen image counts as recycled (first_seen)
aligned_bias_vectors: [operator-state, exporter-state]  # parties to the deal → interest-dependent (one look)
disciplines: {satellite: IMINT}   # source_type → collection discipline (default: textual)
gated_attrs: [foreign_control, readiness]  # must be KNOWN (not UNKNOWN) for an element to reach `confirmed`

half_lives_days:
  # Convention: 1 month = 30d, 1 year = 365d. A type/sub-key with NO entry is DURABLE (freshness=1.0,
  # no decay). Sub-variants: "<edge_type>.<variant>" (SCORE tries the specific key, then the bare edge,
  # then no-decay). Keyed to the edges present in ontology.yaml.
  based-at.field: 30
  based-at.garrison: 540
  inducted-into.named-unit: 540          # possession-by-service is durable (omitted)
  imported-by.holdings: 900              # the transfer event itself is durable (omitted)
  supplies-component.tier-2-3: 540       # deep-tier supplier; revalidate on sanctions/tender/localization
  # supplies-component (prime), manufactures, equips, exported-by, design-authority-for, component-of -> DURABLE (omitted)
  replenishes.event: 3650                # a follow-on order having happened is durable-ish
  replenishes.implication: 900           # "still resupplying?" decays faster
  substitutable-by: 540                  # 18mo (authored default; no doc number)
  # sustained-by -> OMITTED (coarse rollup, not independently scored)
  # same-as, distinct-from, evidenced-by, corroborates, contradicts, supersedes, derived-from -> OMITTED (structural)

half_life_defaults:
  # Class-level fallback keyed by config/ontology.yaml `freshness_class` (spine/04:184-197). SCORE's
  # freshness lookup tries "<edge>.<variant>" -> bare "<edge>" -> THIS class default -> no-decay. It is
  # the fix for the dead `freshness_class` metadata (RCA SC-2): every edge declares a class, but half_lives_days
  # only carries VARIANT sub-keys for based-at/inducted-into/replenishes and nothing tags `freshness_variant`
  # on a claim, so those perishable/semi-durable edges fell through to no-decay and scored as ETERNAL. The
  # class default gives every claim on a decaying edge a reachable half-life; when it fires (no per-edge/variant
  # key matched) the claim is stamped `freshness-variant-assumed:<class>` in the provenance vector (we decayed
  # at the class rate, the variant was NOT tagged — honest, not silent). Keys MUST match the freshness_class
  # spellings in config/ontology.yaml (hyphenated: semi-durable, force-revalidated; n/a with a slash).
  perishable: 540           # D-P4.13: garrison rate (spine/04 based-at garrison = 18mo = 540d); the only value that keeps Rawalpindi stale AND Rahwali fresh on the corpus's real dates
  semi-durable: 540         # 18mo (spine/04 inducted-into named-unit = 18mo = 540d; matches the existing inducted-into.named-unit key)
  force-revalidated: 1825   # 5y clock (spine/04: overhauled-at / trained-by / software-controlled-by = 5y = 1825d)
  durable: null             # no decay (spine/04 durable class)
  n/a: null                 # structural edges — no decay

# INGEST attribution proposer (ingest/attribute.py) — offline, connection-triggered enrichment that turns an
# unattributed subject-blind VLM shape into a cited variant-identity `inference` claim D. Namespaced knobs on
# this surface (extra="allow", no F0-amendment; mirrors resolution.yaml's llm_candidate_gen). Model id is NOT
# here — it flows from the extraction client (client.model_id), same as imagery. Absent block => proposer stays
# dormant (no code-literal defaults). reference_source_classes uses source_class_factors keys (no "reference").
attribution_proposer:
  max_calls_per_rebuild: 8        # budget cap per enrichment pass; every non-firing candidate is logged
  log_skips: true
  candidate:
    presence_edge_types: [based-at, observed-at]                       # deployment + observed-occupancy edges the co-location hangs on
    reference_source_classes: [curated-register, think-tank, trade-media]  # what counts as fingerprint literature
    fingerprint_attrs: [site_signature_geometry, observable_fingerprint, equipment_fingerprint]  # geometry-bearing attrs
    variant_hop_edges: [inducted-into, equips]                         # 1-hop from the variant to reach unit/component fingerprints

# THE DERIVED BASING EDGE (view/basing.py) — the ATTRIBUTION layer of the two-layer basing model
# (EVAL RCA D-P4.1/2/3). USUALLY no source states "formation X is based at site Y" directly; the common
# open-source case is equipment OBSERVED AT a site (`observed-at`, the observed layer) plus equipment serving
# with a formation (`inducted-into`), and the derivation supplies the missing `<unit, based-at, site>` edge
# from that pair. (When a source DOES name a formation at a site — an ORBAT / military-balance reference —
# that is a STATED `based-at`: extractor-emitted, kind=observation, normal credibility, able to confirm. This
# derivation is the FALLBACK for the usual unstated case, never the only source of the edge; and stated is
# not the same as trusted — a grade-E stated basing still runs through source grade and lands at possible.)
#
# WHERE IT RUNS CHANGED IN RK-LAYER (A4/D-13.6/G17). It used to run OFFLINE and MINT a `kind=inference`
# ClaimRecord which it APPENDED to the evidence log — derived output frozen into the append-only record,
# which is the bi-level architecture inverted, and which lets a conclusion outlive its premises across a
# re-record. Now `rebuild()` materializes the edge itself, every rebuild, CITING ITS TWO PREMISE CLAIM-ATOMS
# so the analyst still clicks straight through to the sighting and the induction — with NO mint and NO
# append anywhere under rebuild. The knobs did not move: they describe the derivation, and the derivation is
# unchanged. What was `python -m chanakya.ingest basing` is gone, and so are the `*__basing.json` bundles it
# froze (the loader still reads existing ones with layer_routing OFF, which is what keeps the flag-off view
# byte-identical; DATA removes them from the corpus).
# The derived edge is capped: it carries the `derived-inference` gate flag and cannot reach `confirmed`
# however well its premises are corroborated (D-13.13's weaker provenance path). The minted form got that
# ceiling for free by sharing an independence group with its premises; citing them directly needs it stated.
# Absent block => dormant (no code-literal defaults).
basing_proposer:
  occupancy_edge_types: [observed-at]     # the OBSERVED layer this reads (equipment seen at a site)
  formation_edge_types: [inducted-into]   # what associates that equipment with a named formation
  equipment_hop_edges: [equips]           # 1 hop from an observed COMPONENT to the variant that carries the association
  derived_edge: based-at                  # the lane the derived attribution is written on (must be declared in ontology.yaml)
  require_located_site: true              # only a site you can point to (coordinate or gazetteer match) can be a BASE — a province or an "air defence sector" is an area of operation, not a basing site (md/13 precision spec)
  # Cap the attribution fan-out. R2.1/G15: exceeding it is NO LONGER SILENT — the discarded candidates are
  # named in a Known Gap ("formation count at this site is unresolved: designation coverage needed"). The old
  # pass took formations[:1] and recorded nothing, while every other rejection path in it logged a reason —
  # an order-of-battle UNDERCOUNT with no merge involved, which is exactly why neither the presence/formation
  # gate nor the co-location cap could see it. Raise this to 2 and you get two attributions instead; either
  # answer is honest, and the choice is a config dial. What is not honest is keep-one-and-say-nothing.
  max_units_per_site: 1
  # The affirmative-occupancy vocabulary, as a DENYLIST input: most sources state no occupancy word at all
  # and demanding one would suppress every honest sighting, but a source saying the site is EMPTY must never
  # ground a positive basing (without it, "TELs gone from the old site" derived a basing at the one place the
  # document says the unit left). It is declared here because the imagery lane applies the same vocabulary
  # (`ingest/imagery._OCCUPIED_TOKENS`) and the two must agree or "an empty site is not a deployment" means
  # two different things in two places — and because nothing under rebuild() may import an ingest module,
  # which would drag `make_claim_id` into the rebuild-reachable call graph (G17).
  occupied_tokens: [occupied, garrison, active, deployed, manned, present, occupation]

# INGEST in-document coreference (ingest/coref.py) — extraction pass 2. A second, scoped forced-tool call per
# document that groups mentions the document itself treats as one entity ("CPMIEC" / "the export agency"), each
# group licensed by a verbatim quote. Emits `coref-same-as` claims only; it never merges anything itself — the
# merge is derived at rebuild, so a split stays native.
#
# The producer is ON, and THIS BLOCK IS THE ONLY SWITCH. It used to ride a second, unrelated flag in
# resolution.yaml as well, so a deployment that had declared this block still emitted nothing until another
# file was edited — two switches for one motion, which is how a configured capability comes to look broken.
# The honour policy it was waiting for is in place: the doc-local cluster is the mint grain (it is where the
# referent atom is minted), the per-link deterministic gates and the source-grade floor decide what may bind,
# and D-13.18 lets the rebuild DECLINE a grouping outright. Declaring a category here only makes it
# PROPOSABLE; which categories may auto-bind is the separate, stricter decision in
# resolution.yaml -> earned_identity.authoritative_categories.
#
# Cost is real and stated: a SECOND extraction call per document, and every frozen bundle must be re-recorded
# to carry coreference at all (there are zero coref annotations in the current bundles — ruling M4 — which is
# why S3's gates are exercised on abstract fixtures). With no extraction key it emits nothing rather than
# guessing, so the keyless boot is unaffected either way.
coreference:
  # Which evidence kinds may be emitted. Drop UNAMBIGUOUS_ANAPHOR to run conservative (stated equivalences and
  # name variants only) — anaphora is the highest-reach, highest-risk category. Order is not significance.
  # NOTE this is the PRODUCER list (what may be proposed at all); which of them may auto-BIND is a separate,
  # stricter decision in resolution.yaml -> earned_identity.authoritative_categories, behind a per-link
  # structural gate and a source-grade floor. Proposing is cheap; binding is not.
  categories: [EXPLICIT_EQUIVALENCE, NAME_VARIANT, UNAMBIGUOUS_ANAPHOR]
  max_mentions: 120             # cost guard: a document offering more mentions is skipped whole, never truncated
