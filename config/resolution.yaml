# config/resolution.yaml — relational entity-resolution knobs (spine/08 §3.9; md/05 §4; md/13).
# Validates against F0 ResolutionConfig {merge_weights, bands, blocking_keys, alias_table, transliteration}
# (+ extra knobs, extra="allow"). RESOLVE consumes this; the seeded alias table grows from HITL merges.

# merge_score = Σ w·signal (spine/08 §3.9). TUNED 2026-07-19 (P3.3) to a stated invariant rather than to a
# list of example pairs: EITHER a perfect name/attribute match alone OR a perfect shared-neighbourhood match
# alone must reach the analyst, and NEITHER alone may merge.
#   name only        0.40·1 + 0.40·0 + 0.05·1 + 0.15·0 = 0.45 == hitl_low  -> always queued
#   neighbourhood    0.40·0 + 0.40·1 + 0.05·1 + 0.15·0 = 0.45 == hitl_low  -> always queued
#   deterministic ceiling (everything except the raise-only identity term) = 0.85 == auto_merge, so the
#   fuzzy path can only auto-merge on SIMULTANEOUS perfection; in practice auto-merges come from the
#   bootstrap rules (hard id / alias class / exact name / containment), which is precision-first by design.
# What moved and why: `temporal_consistency` was a constant 1.0 on every non-relocation pair, i.e. a hidden
# +0.15 floor under every score — which made the printed hitl_low of 0.55 behave like 0.40. It is kept as a
# LIVE discriminator (a relocation pair still scores 0 on it) but shrunk to 0.05, and the freed weight went
# to `attribute`; hitl_low then drops to 0.45 so effective strictness is UNCHANGED (0.55−0.15 = 0.45−0.05).
# The numbers now mean what they say. `relational` (the collective-ER signal) and `source_asserted` are
# untouched, and no new auto-merge fires at these weights.
merge_weights:
  attribute: 0.40
  relational: 0.40
  temporal_consistency: 0.05
  source_asserted: 0.15

bands:                    # score ≥ auto_merge -> auto; [hitl_low, auto_merge) -> HITL; < hitl_low -> keep separate
  auto_merge: 0.85
  hitl_low: 0.45
  # D4 Stage 2 — the retained `possible` tier (identity as a three-status hypothesis). A pair scored in
  # [possible_floor, hitl_low) is no longer DROPPED as `separate`; it is kept as a latent watch-list link
  # (confidence + breakdown), OFF the analyst's desk. This is the antidote to fragmentation: the
  # unresolved tail is neither a false merge nor a lonely singleton — it is an honest `possible` link the
  # analyst can see but is not pestered by. In-memory ONLY (Partition.possible) — never drawn as a wire
  # edge, so the view JSON is byte-unchanged. A policy dial (Stage 4 exposes it): lower it to widen the
  # watch-list, raise it to keep only the more-plausible latent links. Absent => the tier is off (no code
  # literal, gate G6) — sub-hitl pairs drop exactly as before.
  possible_floor: 0.25

# Stage 4 (D11) — identity-resolution COVERAGE. Read aggregate, the three-status tail is a collection
# signal: a type for which the resolver keeps producing candidate (`probable`) and watch-list (`possible`)
# identity links but can CONFIRM (`same_as`) few or none is a type the open sources are not corroborating —
# so the honest response is "collect more here", not "tune the resolver". The `GET /coverage` summary flags
# such a type when its unresolved load `(probable + possible) / max(confirmed, 1)` reaches this ratio.
# A POLICY dial (surfaced in the summary): raise it to flag only the starkest gaps, lower it to be more
# sensitive. 2.0 = "twice as many unconfirmable links as confirmed merges" — a conservative default that
# fires only on a genuinely lopsided type, not on ordinary single-subject sparsity. Absent ⇒ gap detection
# is OFF (counts still reported; `collection_gaps` empty) — no code literal, gate G6. Reporting-only: it
# reads the partition, changes no merge decision and draws nothing, so the view JSON is byte-unchanged (G2).
coverage_gap_ratio: 2.0

# Per-type auto-merge floor (P3.5, 2026-07-21). The global auto_merge (0.85) sits at the deterministic score
# ceiling, so the fuzzy fixpoint (Phase 2) never auto-merges — a deliberate precision floor, because on a
# single-subject corpus the TOP of the score distribution is TRAPS (HQ-9 vs HQ-9B, PAF vs PAAD, a Karachi
# site vs a compound in Punjab), not real merges, so lowering the *global* bar admits a trap before any
# genuine merge. Measured per-type, though, two types have a CLEAN gap between their real spelling-variant
# merges and their first same-type trap — manufacturers and trading-orgs, where a near-identical name
# reliably denotes ONE entity. Floor 0.37 admits exactly the four evidence-checked merges (CPMIEC ≡
# "China … Precision Machinery …"; Taian ≡ Taian/Wanshan; the two SINO-GALAXY spellings) with margin above
# every same-type trap (CASIC ≠ its own 23rd Institute at 0.34; ORIENT ≠ SINO-GALAXY at 0.29). Applies only
# when BOTH endpoints carry the listed type. Every identity-sensitive type keeps 0.85; `source` is
# deliberately EXCLUDED — cross-account persona links (@ISPR_Watch vs @Sherdil_Watch) sit right among the
# genuine ones, so that stays a HITL call. Only the auto floor moves: hitl_low, the source-asserted auto
# exclusion and every veto are untouched, so a trap that happens to share the type is still stopped by the
# vetoes, never by this floor. Absent map ⇒ global auto_merge for all pairs (byte-unchanged, gate G2).
auto_merge_by_type:
  manufacturer: 0.37
  trading_org: 0.37

# T3b-F — the relational term's missing denominator. A Jaccard overlap is scale-free, so two entities
# whose ONLY neighbour is the same one score a perfect 1.0: eighteen basing_site pairs, each with a
# single `based-at` edge from the same unit, were reading as "identical neighbourhood" and landing at
# exactly hitl_low (0.40*1 + 0.05 = 0.45) with nothing else about them in agreement. That one artefact
# generated the bulk of the analyst's merge queue.
#
# This is the number of DISTINCT shared neighbours at which the relational signal counts in full; below
# it the overlap is scaled by shared/k. It states the invariant in the same form as the ones above:
#   ONE shared neighbour   0.40*(1.0*1/2) + 0.05 = 0.25 -> keep separate (two things on the same hub)
#   TWO shared neighbours  0.40*(1.0*2/2) + 0.05 = 0.45 == hitl_low -> reaches the analyst, as before
# i.e. "a perfect shared neighbourhood must rest on at least two shared neighbours to reach the analyst
# on its own". It only ever LOWERS a score, so it can never create an auto-merge; and it does not touch
# the raise-only channels — a source-asserted or LLM-proposed pair still reaches the queue on one link.
relational_support_k: 2

blocking_keys:            # candidate generation scope (demo scale: all-pairs-within-block is fine)
  - type
  - country_or_domain_namespace
  - name_token

alias_table:              # canonical -> [known aliases]. SEEDED (auto-merge-eligible). Grows from HITL.
  # --- HQ-9 family (the subject) ---
  "HQ-9/P":
    - "HQ-9P"
    - "FD-2000"           # export designator = HQ-9/P (auto-merge; the seeded merge card)
    - "HIMADS"            # Pakistani service nickname
  "HQ-9":
    - "Hongqi-9"
    - "红旗-9"
    - "紅旗-9"
  "HHQ-9":
    - "海红旗-9"
  # --- Manufacturers / design authorities ---
  "CASIC Second Academy":
    - "2nd Academy"
    - "Second Academy"
    - "China Academy of Defense Technology"
    - "China Changfeng Group"
    - "CCFG"
    - "航天科工二院"
  "Beijing Institute of Radio Measurement":
    - "BIRM"
    - "23rd Research Institute"
    - "23rd Institute"
    - "北京无线电测量研究所"
  # --- S-400 (design-note reference subject; kept minimal — the transliteration marquee) ---
  "S-400 Triumf":
    - "Triumph"
    - "С-400 Триумф"
    - "SA-21 Growler"
  # NOTE (place aliases): config/places.yaml is the authoritative gazetteer for place resolution
  # (md/13 §2). Do NOT duplicate place aliases here.
  # WITHHELD (earned-merge traps — must NOT be seeded here or in places.yaml):
  #   - "Chaklala" / "PAF Base Chaklala" / "RAF Chaklala"  -> pl_nurkhan (earn via ICAO OPRN + proximity, md/13 §6)
  #   - "H-200" -> "HT-233"  -> ORPHAN alias to VERIFY (a candidate, not an assumption); the LLM candidate-gen
  #     recall demo (spine/08 §3.11). Left OUT of the seed on purpose; data agent verifies the mapping first.

transliteration:          # script -> latin (rule-based normalizer seed; spine/08 §3.9, md/13 §2)
  "Триумф": "Triumf"
  "红旗-9": "Hongqi-9"
  "紅旗-9": "Hongqi-9"
  "海红旗-9": "HHQ-9"
  "防盾-2000": "FD-2000"
  "航天科工二院": "CASIC Second Academy"
  "北京无线电测量研究所": "Beijing Institute of Radio Measurement"

# ── extra knobs (extra="allow") ─────────────────────────────────────────────────────────────────
# Identity read from the CLAIM STREAM, source-weighted (D-2.5 / D-P3.4). A `same-as` is ordinary evidence,
# so its weight in merge_score's `source_asserted` term is R(asserting source) — the credibility rubric's
# own output (sources.yaml class x credibility.yaml factors), never a second, divergent scale.
identity_source_weight_default: 1.0  # weight for a source the registry has never heard of. Neutral is safe
                                     # because a same-as is structurally raise-only: HITL, never auto-merge.
identity_raise_min_weight: 0.0       # min R for a same-as to be worth an analyst's time. 0.0 = surface them
                                     # all (recall-biased triage); raise it if the merge queue ever floods.

# D4 banked correction — a bare NAME match must never spend analyst attention. When true, a pair whose
# ONLY nonzero identity signal is `attribute` (i.e. relational == 0 AND source_asserted == 0) may NOT reach
# `probable`/HITL — it is capped at `possible` (the watch-list). `temporal_consistency` is a near-constant
# background term, not an identity signal, so it is not counted. A raise-only channel (a source-asserted or
# LLM-proposed pair) is exempt: an explicit external assertion is more than a name, so it still reaches the
# analyst. DEFAULT FALSE preserves current banding exactly — no existing candidate is reclassified. The cap
# only routes an over-eager name match down to `possible`; it never merges, never vetoes. (Requires
# `possible_floor` for the capped pair to land somewhere; without it the capped pair simply drops.)
# TARGET DEFAULT: on. A bare name match is `possible`, never `probable` (D4 banked correction). If this
# reclassifies a synthetic candidate the answer key still expects, that is a DATA-REFRESH item (logged in
# the calibration ledger), not a reason to default it off — the demo data bends to the target, not vice versa.
name_alone_caps_at_possible: true

# In-document coreference (INGEST extraction pass 2, ingest/coref.py): which evidence categories may
# BOOTSTRAP (auto-merge) rather than merely raise. This is the one signal allowed past the raise-only rule
# above, because it is qualitatively different: the extractor read THIS document's own discourse and must
# quote the span that licenses the grouping — information no string comparison downstream can recover.
#
# Only EXPLICIT_EQUIVALENCE is opted in: the document literally *states* the identity ("Full Name (SHORT)",
# "also known as", an apposition). NAME_VARIANT and UNAMBIGUOUS_ANAPHOR are the extractor *interpreting*
# rather than the document asserting, so they stay raise-only and reach the analyst queue with their quote.
# Empty list => everything coreference proposes is raise-only (Phase-3 D-2.5 behaviour, unchanged).
#
# Still gated by every other rail: a distinct-from veto drops the pair outright, and a type / namespace /
# hard-attribute contradiction demotes it to the queue instead of merging.
#
# SHIPPED EMPTY — every coreference cluster is raise-only, i.e. Phase-3 D-2.5 behaviour, unchanged. Two
# reasons, and the second is the sharp one:
#   1. Independent switches. The producer (credibility.yaml -> coreference) is dormant; if this were
#      pre-set, enabling the producer would silently switch auto-merging on in the same motion.
#   2. A known collision. d10_sat_cloud_gap states "HT-233 (H-200) engagement radar" — textbook
#      EXPLICIT_EQUIVALENCE — but that orphan alias is a deliberate demo beat an analyst is meant to EARN
#      (see cluster._descriptor_extension). Auto-merging it would silently delete the beat. Raise-only
#      keeps it: the pair reaches the queue WITH its licensing quote, so the human still decides but is
#      handed the exact sentence. Measure the false-merge rate on the frozen scenarios before opting in.
#
# To opt in (deliberately, with the producer): coref_authoritative_evidence: [EXPLICIT_EQUIVALENCE]
coref_authoritative_evidence: []

# Open-world name triggers (P3.3): the tail the alias table + entity registry have NEVER seen — a document
# naming the same thing more verbosely, or by its initials. Both are high-precision BOOTSTRAP rules, so
# these gates are what keep them honest. Unset => the trigger is simply off.
containment_min_descriptor_len: 3    # "HT-233" + "engagement" (a WORD) is the same radar described more
                                     # fully; "HQ-9" + "P" (a MARK) is a different missile. The knob is the
                                     # length of the first token the longer name adds.
containment_min_short_tokens: 2      # ...and the SHORT side must be more than one bare word. "China" is a
                                     # prefix of half the manufacturer list and bridged CPMIEC into CASIC;
                                     # "Pakistan" walks straight at the PAAD-vs-PAF unit trap. A one-word
                                     # hook is ambiguous evidence -> it belongs in the queue, not a merge.
acronym_min_len: 3                   # "PAAD" == the initials of "Pakistan Army Air Defence". Under three
                                     # letters an initialism collides with far too much to bootstrap on.

high_alias_risk_types:    # blocks of these types get the LLM candidate-gen recall pass (spine/08 §3.11)
  - variant
  - component
  - unit
  - manufacturer

orphan_block_threshold_k: 2      # fire LLM candidate-gen only when deterministic_candidate_count < k (authored default)
llm_candidate_gen:
  max_calls_per_rebuild: 20      # authored budget cap (spine/08 §3.11 "cap by config budget; log skips")
  batch_per_orphan: true
  log_skips: true

place_proximity_radius_m:        # from config/places.yaml (md/13) — same-place merge radius by precision class
  pad: 500
  site: 1500
  terminal: 3000
  district: 5000
  city: 15000
  province: 150000                 # an admin-level-1 area; an envelope, never a merge target (T5)
place_proximity_hitl_multiplier: 3   # 1x-3x radius -> HITL; beyond -> new place (places.yaml)

# ── geographic compatibility veto on ENTITY same-as (T2) ────────────────────────────────────────
# The gates below guard the PLACE path (which gazetteer node a mention snaps to). Nothing guarded the
# ENTITY path: merge_score compares names, attributes and neighbourhoods, and none of those knows that
# Karachi and Sargodha are ~1,100 km apart. So an "Army Air Defence Centre, Karachi" could be scored
# into the merge queue against a "central Punjab air defence sector" purely on shared wording plus a
# shared neighbour — and if such a pair ever merges, the surviving node keeps whichever coordinate its
# FIRST claim carried (view/pipeline._assemble), i.e. one of the two sites is silently redrawn ~1,000 km
# away on the map. A map that lies about where something is is worse than one that omits it.
#
# So: a thing is in ONE place. When BOTH sides carry their own frozen WGS84 coordinate and the geodesic
# separation exceeds the tolerance for their type, the pair is vetoed — not bootstrapped, not
# auto-merged, and not even queued for the analyst (a geographic impossibility is not a question).
# Deliberately narrow, because a wrong veto costs recall:
#   * a side with NO coordinate is UNKNOWN, never "somewhere else" — absence is not disagreement, the
#     same rule the attribute hard-conflict rail follows. This gate never fires on a toponym-only
#     mention, so it does not pre-empt (or depend on) the toponym-geocoding work;
#   * no gazetteer lookup and no geocoding happen here — identity of PLACES stays in resolve/places.py;
#   * per entity type, with an optional `default` row; a type with neither ⇒ the gate is simply off.
# Values: 25 km for a basing site is far beyond any plausible disagreement between two reports of the
# same site (the gazetteer's coarsest snap radius is 15 km, for a whole city) and far below the scale at
# which two DIFFERENT sites get confused. 100 km elsewhere: an organisation may be stated at two
# addresses in one metro area; it is not stated in two provinces.
entity_geo_conflict_max_km:
  default: 100
  basing_site: 25
# Which gazetteer precision classes may CONSTITUTE identity — i.e. when "these two mentions resolved to
# the same anchor" is allowed to become "these two mentions are the same place" (places.augment). The
# area rungs are deliberately excluded: two batteries both described as being in Punjab, or both "in
# Karachi", are not one battery, and auto-fusing them on a shared province would corrupt the ORBAT far
# more cheaply than it could ever enrich it. Coarse anchors still resolve, still carry a place_ref, and
# still place the node on the map inside an honest envelope — they simply never merge anything.
# Absent / empty => unconstrained, i.e. the pre-T5 behaviour byte-for-byte (gate G2).
place_identity_precision_classes: [pad, site, terminal]

# ── place-matching gates (P3.5 / RES-5) ─────────────────────────────────────────────────────────
# The radii above are JITTER absorption: a coord a few hundred metres off is the same pad. With no
# compatibility gate around them, jitter absorption becomes GARBAGE absorption — an "Army Air Defence
# Centre" sitting 4.5 km from the Port of Karachi was being pulled into a container terminal. These two
# gates apply to the PROXIMITY path only: a hard ID (ICAO/LOCODE) or an exact toponym/alias match states
# identity outright, and gating those would also disarm the Karachi-Port != Port-Qasim trap (both ports
# have to resolve before the gazetteer's distinct_from can veto them apart).
#
# What an entity type may be pulled onto. A statement about the WORLD (an air-defence site is not a
# port), so it is config, not code. A type with no row here (and no `default` row) is unconstrained.
place_allowed_precision_classes:
  basing_site: [pad, site]     # a battery/base snaps to a pad or a site — never a port terminal, and
                               # never a district/city (those are AREAS; snapping to one is a fiction).
  # T3b-A: the mirror image. An `area_of_operations` (a sector, a coastal belt, a province) is an area of
  # responsibility, so the fiction runs the other way: it must NEVER be snapped onto a pad or a site, and
  # the coarse rungs are exactly the right home for it. Rendering follows from the class the anchor
  # carries — an area lands on a district/city/province anchor, which the map draws as an uncertainty
  # envelope rather than a point. (`province` is T5's new rung; harmless before that lands.)
  area_of_operations: [district, city, province]

# Which entity types take part in place resolution at all. Previously unset, so it defaulted to the one
# location-primary type in C (`basing_site`) — which meant the moment T3b-A retyped sectors/belts/
# provinces off that type they would have fallen off the map entirely. Stated explicitly so the two
# place-bearing types are visible in one line and adding a third is a config edit (T5 handoff).
place_entity_types: [basing_site, area_of_operations]

# A vague geocode must not be snapped into a precise pad: "central Punjab" geocodes to a fuzzy regional
# point, and INGEST records how much it trusts each candidate. Below this floor the mention keeps its own
# coordinate and stands as an honest pin. A candidate with NO stated confidence is UNKNOWN, not low —
# RESOLVE does not invent doubt INGEST never expressed (the class gate above still applies to it).
place_min_geocode_confidence: 0.6

# A toponym is a NAME, not a description of where something is. A display string carrying one of these
# markers ("Malir District, Karachi, Sindh Province, Pakistan"; "Air Defence Depot, ~12 km NNW of Kala
# Chitta / Attock Cantt area") is not usable as a place name — RESOLVE falls back to INGEST's frozen
# proposed_alias, and otherwise matches on coordinates/hard-ID alone. Empty => every name is accepted.
toponym_descriptive_markers: [",", "~", "/", " km "]

# May a mention carrying NO coordinate bind to an anchor whose curated name it states EXACTLY? Yes (P3.6).
# "PAF Base Nur Khan" is a seeded alias of pl_nurkhan, so a document using that string is naming an
# analyst-curated anchor, not inferring one from distance — the same precision standard the entity alias
# table already merges on. It matters because a grid reference frozen unparsed leaves the entity with no
# point at all, and the origin end of the Rawalpindi -> Rahwali relocation would otherwise render
# unanchored. EXACT curated canonical_name/alias only: no fuzzy, no substring, no proximity — so the
# withheld earned-merge traps ("Chaklala" / "PAF Base Chaklala" / "RAF Chaklala"; Rahwali's relative-
# bearing form) stay EARNED-only, and vague mentions ("Sargodha", "central Punjab") still bind to
# nothing. The gazetteer's distinct_from veto applies to these matches exactly as to any other.
# false / absent => off.
place_bind_on_curated_toponym: true

# ── attribute roles (D5/D6): critical / supporting / neutral, per entity type ────────────────────
# Every attribute has an identity ROLE. UNLISTED ⇒ NEUTRAL (no identity effect) — the safe, extendable
# default, so this block never has to enumerate the whole ontology.
#   * critical   — a STATED disagreement is a HARD veto: a cannot-link no similarity score may cross,
#                  enforced before scoring and transitively (the D5 wall, generalised from the geographic
#                  and hard-identifier walls to declared attributes). Absence is never a conflict.
#   * supporting — agreement raises identity confidence; a stated disagreement is a SOFT penalty
#                  (× attribute_scoring.conflict_penalty), never fatal. Inert here until conflict_penalty
#                  is configured (it is not), so these declarations are documentation + a later-stage seam.
#   * time_role  — OPTIONAL, and CONSUMED (C6, re-specified 2026-07-25). Four values, each earning its own
#                  identity consequence. The boolean `perishable:` it replaces is RETIRED and is now a LOUD
#                  validation error (no migration shim outlives its stage) — a boolean could not carry three
#                  states, which is exactly why C6 as first written could not be built:
#                    durable       — a stable spec. Agreement supports identity normally.
#                    perishable    — expected to change. Perishable-only evidence CANNOT confirm (D-13.9a),
#                                    and a clean ordered succession of differing values is forgiven.
#                    constitutive  — the attribute IS part of what this instance is (a presence *is*
#                                    operator+design+site+window). It cannot change without being a
#                                    DIFFERENT instance, so a difference is a DISTINCTNESS signal, never
#                                    staleness — and agreement can confirm. This is what lets a presence
#                                    confirm at all.
#                    identifying   — the attribute identifies the entity (a place's coordinates). Strong
#                                    identity evidence; satisfies the non-perishable requirement to confirm.
#                  Without `constitutive` and `identifying`, spine/13 §6 lever 2 has no rung to stand on.
#                  Rows using the two NEW values live in `earned_identity.attribute_roles` (bottom of this
#                  file), not here: declaring them unconditionally would move the flag-off graph.
# Conservative starter taxonomy (err toward NOT walling). Exactly ONE critical is wired — variant
# .operator_branch, the D5 marquee wall — and it was verified ADDITIVE-AND-INERT on the frozen corpus:
# no variant STATES operator_branch (the China/Pakistan traps are already held apart by
# config/entities.yaml distinct_from), so it produces zero veto pairs and changes no partition. It is
# declared anyway because the mechanism must be designed for the discipline, not for the corpus in hand.
#
# NORMALISATION FINDING (why unit.service_branch and trading_org.origin_country are NOT critical). Both
# are natural D5 walls in principle (a different branch / country ⇒ a different entity), but the corpus
# STATES them unnormalised: service_branch appears as 'Air Force' / 'PAF' / 'Pakistan Air Force' (all one
# branch) and 'Army' / 'Pakistan Army'; origin_country as 'CHINA' vs 'China'. A critical veto compares
# values exactly (absence ≠ conflict, but 'CHINA' ≠ 'China'), so walling them SHATTERS legitimate merges —
# it split the three SINO-GALAXY trading-org spellings and would false-wall 'PAF' from 'PAF air defense
# units'. So they are SUPPORTING here (identity-relevant, never a wall); promoting them to critical needs
# value normalisation first (a later stage). This is the honest limit of an exact-match wall on this data.
attribute_roles:
  variant:
    operator_branch: {role: critical}                 # D5: a PLA HQ-9 and the Pakistan export HQ-9 line
                                                       # cannot be one entity — a stated branch difference is a wall.
                                                       # Currently inert: no variant states operator_branch.
    family:          {role: supporting, time_role: durable}   # a durable spec — a disagreement lowers confidence.
    range_class:     {role: supporting, time_role: durable}
  unit:
    service_branch:  {role: supporting, time_role: durable}   # a D5 wall in principle, but the corpus states it
                                                             # unnormalised (Air Force / PAF / Pakistan Air Force) —
                                                             # see the normalisation finding above. Kept soft for now.
    alert_posture:   {role: supporting, time_role: perishable}    # a stated readiness/alert status — expected to
                                                             # CHANGE over time (never a durable identity trait),
                                                             # so agreement is soft-supporting and it is flagged
                                                             # perishable for the time-aware conflict axis (D8/3B):
                                                             # a clean update over time is not a contradiction.
  trading_org:
    origin_country:  {role: supporting, time_role: durable}   # likewise: 'CHINA' vs 'China' would false-wall the
                                                             # SINO-GALAXY spellings. NOT a namespace field, so it
                                                             # would be a genuinely new wall once values are normalised.
  component:
    radar_band:      {role: supporting, time_role: durable}
    component_class: {role: supporting, time_role: durable}
  manufacturer:
    tier:            {role: supporting, time_role: durable}

# ── credibility floor on the critical-attribute veto (D5 take-care a, Stage 3A) ──────────────────
# A source-credibility floor on the critical→veto wall above. A stated critical-attribute disagreement
# is a HARD wall only when it is trustworthy on BOTH sides — each side's conflicting value asserted by a
# source whose STANAG reliability_grade (config/sources.yaml) is at/above this floor. Below it, the pair
# is NOT walled and NOT silently merged: it is RAISED to the analyst as a `probable` candidate with a
# reason, so one flaky low-grade source cannot shatter a well-corroborated merge (only flag it).
#
# STANAG grades are ordinal, A (most reliable) → F (least); `C` walls on A/B/C and raises on D/E/F.
# TARGET = C: in this corpus C is the boundary between the working analytic tier (curated register B,
# trade-media / customs-tender C — whose stated country/branch/serial is trustworthy enough to wall a
# merge on) and the D/E social-repost / spoof / adversary tier the floor exists to neutralise (d08/d16
# grade-D social, d12/d13/d20 grade-E reshares & relocation-spoof, d23 grade-D false-attribution). A
# country/serial clash asserted only by that tier is exactly the "flaky low-grade source" D5 warns about.
#
# Scoped STRICTLY to the critical-attribute veto — curated distinct_from, geo, and hard-identifier vetoes
# are structural/curated and stay unconditional. Absent ⇒ floor OFF ⇒ the critical veto is unconditional
# (pre-Stage-3A, byte-unchanged). ON at the target here; currently INERT on the frozen corpus because no
# variant STATES operator_branch (the one wired critical attr), so it walls zero pairs today — declared
# for the discipline, exercised by the unit tests.
critical_veto_min_grade: C

# Non-place keep-separate traps (the geographic Karachi-Port vs Port-Qasim pair lives in places.yaml's
# own distinct_from field — intentionally NOT duplicated here).
distinct_from:
  "HQ-9/P":
    - "FT-2000"            # anti-radiation variant — false-merge trap (HITL band)
    - "HQ-9BE"             # flagship distinct-from: ~125 km Army vs ~260 km PAF

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# EARNED IDENTITY — the RK-COREF (S3) stage block. ONE FLAG, mirroring S2's `layer_routing.enabled`.
# ══════════════════════════════════════════════════════════════════════════════════════════════════
#
# S1 gave claims a stable address; S2 split design from instance; S3 makes identity EARNED. The pieces
# below are one change to *what earns identity* and half of them would be incoherent — promoting
# coreference to a required tier without the decline mechanism, or binding the caps to the bootstrap
# without the per-layer profile, each leaves the system worse than either end state. So: one flag.
#
# `enabled: false` ⇒ every mechanism here is inert and the graph is byte-identical to S2's flag-off view.
# Every threshold, cap, floor, category list and vocabulary this stage adds lives HERE, never as a code
# literal (gate G6). Ceilings are declared as BAND NAMES, never floats: analyst B's arithmetic showed any
# ×coefficient can drop a pair TWO bands — out of the analyst's queue entirely — and its safe value
# depends on thresholds that will move. A band name is threshold-independent.
earned_identity:
  enabled: false

  # ── D-13.17 — which coreference categories may BOOTSTRAP (an uncapped, unbanded fusion at 1.0) ────
  # An "authoritative" coref pair is a Phase-1 bootstrap trigger: it merges at hardcoded confidence 1.0
  # and BYPASSES BANDING, so no cap restrains it. Two consequences fix the policy:
  #   1. a category may only be authoritative behind a DETERMINISTIC, code-verified precondition — a
  #      model's self-report is not evidence, but a self-report plus a structural check any reader can
  #      re-derive is (see `equivalence_markers`, and the positive anaphor gate in ingest/coref.py);
  #   2. it must ALSO clear a source-grade floor, because a bind currently acts HARDER than the assertion
  #      it most resembles: a source-stated `same-as` is grade-floored AND structurally raise-only, while
  #      a coref bind fuses at 1.0 with no grade check anywhere. That inversion is the sharpest gap in the
  #      substrate; `stated != trusted` (spine/13 §5).
  # NAME_VARIANT is ABSENT, permanently, and for a mechanical reason rather than caution: because an
  # authoritative pair bypasses banding, "authoritative NAME_VARIANT" *is* the exact-normalised-name
  # auto-merge lane D-13.1 exists to delete — rebuilt on a different predicate and immune to the very
  # name cap (below) that replaces it. It stays raise-only, which is a `probable` HITL candidate with the
  # licensing quote attached and the merge one click away, not a nameless orphan.
  authoritative_categories: [EXPLICIT_EQUIVALENCE, UNAMBIGUOUS_ANAPHOR]

  # STANAG floor for the asserting DOCUMENT's source. `C` admits the working analytic tier (curated
  # register B, trade-media / customs-tender C) and refuses the D/E social-repost / spoof / adversary
  # tier — deliberately the SAME letter as `critical_veto_min_grade` above, because the question is the
  # same one ("is this source trustworthy enough to move identity on its own?") and two different answers
  # to one question is a bug waiting to happen. Absent ⇒ no floor (and the bind is then only as strong as
  # its structural gate, which is why this is not optional in the shipped config).
  bind_min_grade: C

  # The EXPLICIT_EQUIVALENCE gate's marker vocabulary, verb forms included (C5). The gate is: the quote
  # occurs verbatim in the document (already enforced at ingest) AND contains BOTH members' surface forms
  # AND contains one of these markers, or wraps one form in a parenthetical. Declared as config so an
  # analyst can extend it for a new register/language without a code change.
  equivalence_markers:
    - "aka"
    - "a.k.a"
    - "also known as"
    - "also called"
    - "also designated"
    - "otherwise known as"
    - "referred to as"
    - "known locally as"
    - "formerly"
    - "formerly known as"
    - "renamed"
    - "redesignated"
    - "designated"
    - "export designation"
    - "export designated"
    - "marketed as"
    - "sold as"
    - "or simply"
    - "hereafter"
    - "i.e."
    - "namely"
    - "alias"
    - "abbreviated"
    - "short for"
    - "which is"
    - "that is"

  # ── the three CAPS, as band names (D-13.10 / D-13.14 / D-13.19) ───────────────────────────────────
  # NAME caps at `possible` at EVERY layer, and — the part §4 of the review found missing — the cap binds
  # the PHASE-1 BOOTSTRAP too, not only the Phase-2 collection loop. Name is a verdict in Phase 1 at every
  # type: the widest name-only fusion path bypasses the bands entirely, so a cap that lives only in Phase 2
  # is a cap on the path nobody takes. "One more trivially-available signal clears it" is what makes this a
  # cap and not a ban.
  name_ceiling: possible
  # CO-LOCATION caps a FORMATION merge at `probable` (D-13.14 / G16). Shared design + site + operator is a
  # presence-level fact; confirming a *formation* needs a unit-level discriminator. This is anti-fabrication
  # machinery, not OOB hygiene: `based-at` is functional and unit-keyed, so a formation over-merge makes two
  # sites one unit's before/after, the supersede path then DRAWS a relocation, removes the analyst, and
  # deletes the retired edge's Known Gap. One identity error becomes a fabricated movement assessment with
  # the human taken out of the loop.
  colocation_ceiling: probable
  # A same-document STATED-CONTRAST pair caps at `probable` — it reaches the analyst with its licensing
  # quote and can never auto-merge. Ungraded on purpose: a band ceiling cannot *shatter* an existing
  # cluster (it withholds one new fusion; the cluster can still form transitively through other pairs), so
  # the harm a grade gate would have defended against does not exist here. ABSENCE of contrast is NEUTRAL —
  # never a prior *for* merging either.
  contrast_ceiling: probable

  # ── D-13.14 / G16 — what the co-location cap is scoped to ─────────────────────────────────────────
  # The two citizens S2 created. A presence-level merge in a co-location case is EXPECTED and must not be
  # capped; a formation-level one must be.
  formation_types: [unit]
  presence_types: [presence]
  # Predicates whose SHARED endpoint is co-location evidence, not identity evidence: two batteries at one
  # airfield operating one design under one branch share all of these BY CONSTRUCTION.
  colocation_predicates: [based-at, observed-at, instance-of, operated-by, equips, inducted-into]
  # The unit-level discriminators that CAN confirm a formation over and above co-location. A shared
  # DESIGNATION is deliberately NOT enough on its own — see hard_id_fields.unique below.
  formation_discriminators: [designator, echelon, parent_unit, equipment_fingerprint, home_garrison]

  # ── D-13.8 / G18 — the relationship-conflict wall ─────────────────────────────────────────────────
  # A STATED conflict on one of these predicates at OVERLAPPING times is a HARD WALL, not a relational
  # score: two units at different sites at overlapping times are different units. The wall joins the
  # `veto` set — hard AND transitive, re-applied in `finalise`, drawn as a do-not-merge edge and carrying
  # an analyst-visible reason. Built the geo-veto way it would be non-transitive AND invisible while G18
  # still passed, which is the failure §5a was written to stop.
  wall_predicates: [based-at, operated-by]
  # C1 (as amended by S2): the `based-at` half fires WITHIN ONE site class. A differing class is NOT a
  # conflict — a unit at its garrison and concurrently at a forward site is one unit with two basings. The
  # rule is per-(subject, predicate) over EVERY basing of that subject, applied AFTER derivation: a
  # per-edge tag silently killed the flagship relocation because separation IS de-confliction, so a
  # PARTIAL tag is worse than none. Any unmapped class on any of a subject's basings ⇒ the whole subject
  # falls back to ONE bucket (no de-confliction) and the wall RAISES instead of walling, with a named gap.
  wall_scope_attr: site_type

  # ── C7 — value normalization is a prerequisite for walling on ANY slot ────────────────────────────
  # The shipped config already states the problem by name: sources write `service_branch` as 'Air Force' /
  # 'PAF' / 'Pakistan Air Force' and `origin_country` as 'CHINA' vs 'China', and because a critical veto
  # compares values EXACTLY, walling them "SHATTERS legitimate merges". So both were demoted to
  # `supporting` — and `supporting` is inert. Normalisation is what lets them be walls again. Applied
  # BEFORE conflict detection AND BEFORE namespace derivation (normalising only at conflict time would
  # leave the namespaces split, which is the broken half of D4).
  # Matching is casefolded and punctuation-collapsed on both sides, so only GENUINE synonyms need a row.
  value_normalization:
    service_branch:
      "Pakistan Air Force": ["PAF", "Air Force", "P.A.F.", "PAF Air Defence", "PAF air defense units"]
      "Pakistan Army": ["Army", "PA", "Pakistan Army Air Defence", "PAAD", "Army Air Defence"]
      "Pakistan Navy": ["Navy", "PN"]
      "People's Liberation Army Air Force": ["PLAAF", "PLA Air Force"]
      "People's Liberation Army": ["PLA", "PLAGF", "PLA Ground Force"]
    operator_branch:
      "Pakistan Air Force": ["PAF", "Air Force", "P.A.F."]
      "Pakistan Army": ["Army", "PA", "PAAD", "Pakistan Army Air Defence"]
      "People's Liberation Army Air Force": ["PLAAF", "PLA Air Force"]
      "People's Liberation Army": ["PLA", "PLAGF"]
    origin_country:
      "China": ["CHINA", "PRC", "People's Republic of China", "CN"]
      "Pakistan": ["PAKISTAN", "PK", "Islamic Republic of Pakistan"]
    country:
      "China": ["CHINA", "PRC", "People's Republic of China", "CN"]
      "Pakistan": ["PAKISTAN", "PK", "Islamic Republic of Pakistan"]
  # The slots for which an UNNORMALIZABLE stated value takes the third state: NO WALL and NO FUSION, plus
  # a named gap. All three or none — a gap that does not bind the fusion path is decoration (that is the
  # rk-14 probe bug: the prototype named the missing operator gap and then asserted the assessment anyway,
  # drawing a cross-army relocation). A slot listed here is one we intend to WALL on, so an unreadable
  # value is a refusal on stated grounds, never a silent pass in either direction.
  normalization_required_attrs: [service_branch, operator_branch, origin_country, country]

  # ── C6 — the two NEW time roles, declared here because they change behaviour ──────────────────────
  # Merged over the base `attribute_roles` block above, per type and per attribute, ONLY with the flag on.
  # This is the rung spine/13 §6 lever 2 needs and has never had:
  #   * a PRESENCE *is* operator + design + site + window, so those are `constitutive` — they cannot change
  #     without it being a different presence, which is simultaneously (a) what lets two co-located reports
  #     collapse into ONE presence (agreement on a constitutive attribute can confirm) and (b) what keeps
  #     a differing one apart (a difference is DISTINCTNESS, not staleness).
  #   * a PLACE is its coordinates, so `coordinates` is `identifying` on the location-primary types.
  #   * a FORMATION's geography is `perishable` — a unit moves. Same attribute, opposite role, different
  #     type: that per-(type, attribute) keying is the half of C6 that was never the problem.
  attribute_roles:
    presence:
      operator_branch: {role: critical, time_role: constitutive}
      service_branch:  {role: critical, time_role: constitutive}
      site:            {role: critical, time_role: constitutive}
      design:          {role: critical, time_role: constitutive}
      observed_window: {role: supporting, time_role: constitutive}
      count:           {role: neutral,   time_role: perishable}
    basing_site:
      coordinates:     {role: supporting, time_role: identifying}
    unit:
      # A unit MOVES: its geography is perishable, and perishable-only evidence cannot confirm it.
      home_garrison:   {role: supporting, time_role: perishable}
      designator:      {role: supporting, time_role: durable}
      echelon:         {role: supporting, time_role: durable}
